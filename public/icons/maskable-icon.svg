<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed background for maskable safe zone -->
  <rect width="512" height="512" fill="#F5A623"/>
  <!-- Engram mark centered in safe zone (80% = 51px padding each side, usable 410x410 centered) -->
  <!-- Scale original 36x36 mark to ~200x200, centered at 256,256 -->
  <g transform="translate(256,256) scale(5.5)">
    <!-- shadow rect -->
    <rect x="-9" y="-9" width="28" height="28" rx="8" fill="#1C1917" opacity="0.18"/>
    <!-- main background -->
    <rect x="-12" y="-12" width="28" height="28" rx="8" fill="#0F1117" stroke="#F5A623" stroke-width="1.5"/>
    <!-- dendritic branches from center node -->
    <line x1="0" y1="0" x2="0"   y2="-8.5" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-8"  y2="7"    stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8"   y2="7"    stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <!-- terminal nodes -->
    <circle cx="0"  cy="-8.5" r="2.5" fill="#F5A623"/>
    <circle cx="-8" cy="7"    r="2"   fill="#F5A623"/>
    <circle cx="8"  cy="7"    r="2"   fill="#F5A623"/>
    <!-- center node -->
    <circle cx="0"  cy="0"    r="3.5" fill="#F5A623"/>
  </g>
</svg>
