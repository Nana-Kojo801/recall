<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <defs>
    <clipPath id="rnd">
      <rect x="1" y="1" width="34" height="34" rx="10"/>
    </clipPath>
  </defs>
  <!-- dark background -->
  <rect x="1" y="1" width="34" height="34" rx="10" fill="#0F1117"/>
  <!-- accent border -->
  <rect x="1" y="1" width="34" height="34" rx="10" fill="none" stroke="#F5A623" stroke-width="1.5"/>
  <!-- engram mark centered at 18,18 -->
  <g clip-path="url(#rnd)">
    <line x1="18" y1="18" x2="18" y2="9"  stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="18" x2="9"  y2="26" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="18" x2="27" y2="26" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="18" cy="9"  r="2.5" fill="#F5A623"/>
    <circle cx="9"  cy="26" r="2"   fill="#F5A623"/>
    <circle cx="27" cy="26" r="2"   fill="#F5A623"/>
    <circle cx="18" cy="18" r="3.5" fill="#F5A623"/>
  </g>
</svg>
